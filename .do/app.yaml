name: askfinbot
region: sgp
services:
  - name: web
    github:
      repo: hxyan2020/askfinbot
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: DEEPSEEK_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
